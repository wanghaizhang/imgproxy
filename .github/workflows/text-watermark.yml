name: Build imgproxy - text-watermark

on:
  workflow_dispatch:

  push:
    branches:
      - text-watermark

permissions:
  contents: read
  packages: write

concurrency:
  group: imgproxy-text-watermark
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    env:
      BUILDKIT_PROGRESS: plain

    steps:
      # 1. 拉取 text-watermark 分支代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: text-watermark

      # 2. 自动识别 Dockerfile 位置
      - name: Locate Dockerfile
        id: dockerfile
        shell: bash
        run: |
          if [ -f "./docker/Dockerfile" ]; then
            echo "file=./docker/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ -f "./Dockerfile" ]; then
            echo "file=./Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Dockerfile not found"
            exit 1
          fi

      # 3. 初始化 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 生成镜像标签
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=text-watermark
            type=sha,format=short

      # 6. 构建并推送镜像，同时导出 TAR
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/imgproxy.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. 上传 Docker 镜像 TAR
      - name: Upload Docker Image TAR
        uses: actions/upload-artifact@v4
        with:
          name: imgproxy-text-watermark-linux-amd64
          path: /tmp/imgproxy.tar
          if-no-files-found: error
          retention-days: 14
