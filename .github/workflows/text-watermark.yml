name: Build imgproxy Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '**/*.go'
      - '**/*.c'
      - '**/*.h'
      - '.github/workflows/build-imgproxy.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Linux AMD64 Image
    runs-on: ubuntu-latest

    steps:
      # 1. 获取源码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 编译并导出 Docker 镜像 TAR
      - name: Build imgproxy
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile

          platforms: linux/amd64

          push: false

          tags: imgproxy:custom

          outputs: type=docker,dest=/tmp/imgproxy.tar

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. 检查 TAR 文件
      - name: Verify Docker Image
        run: |
          ls -lh /tmp/imgproxy.tar
          file /tmp/imgproxy.tar
          tar -tf /tmp/imgproxy.tar | head -20

      # 5. 上传 TAR 到 GitHub
      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: imgproxy-linux-amd64
          path: /tmp/imgproxy.tar
          if-no-files-found: error
          retention-days: 14
